<!-- Este documento HTML define una página de inicio de sesión para un sistema de gestión de inventarios llamado Stock .Plus -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de codificación y metadatos básicos -->
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Asegura que el diseño sea responsivo -->
    <meta name="description" content="Sistema de gestión de inventarios accesible y fácil de usar."> <!-- Breve descripción de la página -->
    <title>Sistema de Gestión de Inventarios</title> <!-- Título que aparece en la pestaña del navegador -->
    <link rel="stylesheet" href="styles.css"> <!-- Enlace al archivo de estilos CSS externo -->
</head>
<body>
    <!-- Encabezado principal de la página -->
    <header>    
        <h1>Bienvenido a Stock .Plus<br> Tu software de gestión de inventarios</h1>
    </header>

    <!-- Barra de navegación con enlaces a diferentes secciones del sistema -->
    <nav id="mapanav_1">
        <a href="Inicio.html">Iniciar Sesión</a>
        <a href="registro.html">Registro</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <!-- Contenido principal de la página -->
    <main>
        <section id="inicio_sesion"> <!-- Sección dedicada al inicio de sesión -->
            <h2>Iniciar Sesión</h2>
            <div class="iniciov1">
                <!-- Formulario para capturar las credenciales de inicio de sesión -->
                <form id="loginForm" aria-label="Formulario de inicio de sesión">
                    <label for="username">Nombre de usuario:</label>
                    <input type="text" id="username" name="username" required> <!-- Campo para el nombre de usuario -->

                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required> <!-- Campo para la contraseña -->

                    <div class="inicio_boton">
                        <input type="submit" value="Iniciar Sesión"> <!-- Botón de envío del formulario -->
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Enlaces adicionales para opciones secundarias -->
    <div class="olvido-contraseña">
        <a href="#" class="enlace-centrado">¿Olvidaste tu contraseña?</a> <!-- Enlace para recuperación de contraseña -->
    </div>
    <div class="derecha">
        <a href="registro.html" class="enlace-grande">Regístrate</a> <!-- Enlace al formulario de registro -->
    </div>

    <!-- Pie de página -->
    <footer>
        <p>© 2024 Sistema de Gestión de Inventarios</p> <!-- Derechos reservados -->
    </footer>

    <!-- Script en JavaScript para validar el formulario de inicio de sesión -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Evita que el formulario se envíe de manera predeterminada

            // Obtener los valores ingresados en los campos del formulario
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            // Validar si el nombre de usuario y la contraseña son correctos
            if (username === "milton" && password === "milton") {
                alert("¡Login exitoso! Bienvenido, " + username);
                // Redirige a otra página tras el inicio de sesión exitoso
                window.location.href = "bienvenido.html"; // Cambiar por la página deseada
            } else {
                alert("Usuario o contraseña incorrectos. Inténtalo de nuevo.");
            }
        });
    </script>
</body>
</html>
