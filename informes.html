<!DOCTYPE html> <!-- Define el tipo de documento como HTML5 -->
<html lang="es"> <!-- Establece el idioma del documento como español -->
<head>
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura el diseño responsivo para dispositivos móviles -->
    <meta name="description" content="Sistema de gestión de inventarios accesible y fácil de usar."> <!-- Descripción de la página -->
    <title>Sistema de Gestión de Inventarios</title> <!-- Título que aparecerá en la pestaña del navegador -->
    <link rel="stylesheet" href="styles.css"> <!-- Enlace a la hoja de estilos CSS -->
</head>
<body> <!-- Comienza el cuerpo del documento -->

<nav id="mapanav_4"> <!-- Navegación principal de la página -->
    <a href="bienvenido.html">Gestión de Inventario</a> <!-- Enlace a la sección de gestión de inventario -->
    <a href="informes.html">Generación de Informes</a> <!-- Enlace a la sección de generación de informes -->
    <a href="contactonoreg.html">Contacto</a> <!-- Enlace a la sección de contacto dentro de la misma página -->
    <a href="Inicio.html">Cerrar sesión</a> <!-- Enlace para cerrar sesión -->
</nav>

<section id="reportes"> <!-- Sección dedicada a la generación de informes -->
    <h2>Generación de Informes</h2> <!-- Título secundario de la sección -->
    <form action="generate-report.html" method="POST" aria-label="Generar informe de inventario"> <!-- Formulario para generar informes -->
        <label for="start-date">Fecha de Inicio:</label> <!-- Etiqueta para el campo de fecha de inicio -->
        <input type="date" id="start-date" name="start-date" required> <!-- Campo de entrada para la fecha de inicio -->

        <label for="end-date">Fecha de Fin:</label> <!-- Etiqueta para el campo de fecha de fin -->
        <input type="date" id="end-date" name="end-date" required> <!-- Campo de entrada para la fecha de fin -->

        <input type="submit" value="Generar Informe"> <!-- Botón para enviar el formulario y generar el informe -->
    </form> <!-- Cierre del formulario -->
</section> <!-- Cierre de la sección de generación de informes -->

<footer> <!-- Pie de página -->
    <p>© 2024 Sistema de Gestión de Inventarios</p> <!-- Texto de copyright -->
</footer>
</body>
</html>
